<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7c3aed" />
    <title>Resume Studio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#top" aria-label="Resume Studio home"><span>R</span> Resume Studio</a>
      <div class="topbar-actions">
        <button class="button button-quiet" id="resetButton" type="button">Reset</button>
        <button class="button button-dark" id="printButton" type="button">Download / Print</button>
      </div>
    </header>

<main id="top" class="workspace">
    <section class="editor-panel" aria-labelledby="editor-title">

        <div class="eyebrow">Resume builder</div>

        <h1 id="editor-title">Build your next opportunity.</h1>

        <p class="intro">
            Fill in your details and watch your professional resume take shape.
        </p>

        <form id="resumeForm">

            <!-- Personal Details -->
            <fieldset>
                <legend>Personal details</legend>

                <div class="field-grid">

                    <label>
                        Full name
                        <input
                            id="fullName"
                            autocomplete="name"
                            placeholder="Enter your full name"
                        />
                    </label>

                    <label>
                        Professional title
                        <input
                            id="title"
                            placeholder="e.g. Frontend Developer"
                        />
                    </label>

                    <label>
                        Email
                        <input
                            id="email"
                            type="email"
                            autocomplete="email"
                            placeholder="example@email.com"
                        />
                    </label>

                    <label>
                        Phone
                        <input
                            id="phone"
                            type="tel"
                            autocomplete="tel"
                            placeholder="+1 555 123 4567"
                        />
                    </label>

                    <label class="full-width">
                        Location
                        <input
                            id="location"
                            autocomplete="address-level2"
                            placeholder="City, Country"
                        />
                    </label>

                </div>
            </fieldset>


            <!-- Profile -->
            <fieldset>
                <legend>Profile</legend>

                <label>
                    About you
                    <textarea
                        id="summary"
                        rows="4"
                        placeholder="Write a short professional summary about yourself..."
                    ></textarea>
                </label>

            </fieldset>


            <!-- Skills & Languages -->
            <fieldset>
                <legend>Skills & languages</legend>

                <div class="field-grid">

                    <label>
                        Skills
                        <span>Separate with commas</span>

                        <textarea
                            id="skills"
                            rows="3"
                            placeholder="Figma, React, UX Research, JavaScript"
                        ></textarea>
                    </label>

                    <label>
                        Languages
                        <span>Separate with commas</span>

                        <textarea
                            id="languages"
                            rows="3"
                            placeholder="English — Native, French — Conversational"
                        ></textarea>
                    </label>

                </div>
            </fieldset>


            <!-- Experience -->
            <fieldset>
                <legend>Experience</legend>

                <label>
                    Current / most recent role

                    <textarea
                        id="experience"
                        rows="5"
                        placeholder="Company: ABC Company&#10;Role: Frontend Developer&#10;Years: 2024 - Present"
                    ></textarea>
                </label>

            </fieldset>


            <!-- Education -->
            <fieldset>
                <legend>Education</legend>

                <label>
                    Education details

                    <textarea
                        id="education"
                        rows="3"
                        placeholder="Degree: B.S. Computer Science&#10;School: University"
                    ></textarea>
                </label>

            </fieldset>


            <!-- Save -->
            <button
                class="button button-dark"
                type="submit"
            >
                Save Resume
            </button>

        </form>

    </section>


    <!-- Live Preview -->
    <section
        class="preview-area"
        aria-label="Live resume preview"
    >

        <div class="preview-label">
            <span class="status-dot"></span>
            Live preview
        </div>

        <article
            class="resume"
            id="resumePreview"
        >

            <div class="accent-column"></div>

            <div class="resume-content">

                <!-- Resume Header -->
                <header class="resume-header">

                    <div
                        class="monogram"
                        id="previewInitials"
                    ></div>

                    <div>

                        <p
                            class="resume-name"
                            id="previewName"
                        ></p>

                        <p
                            class="resume-title"
                            id="previewTitle"
                        ></p>

                    </div>

                </header>


                <!-- Contact -->
                <div class="contact-row">

                    <span id="previewEmail"></span>

                    <span id="previewPhone"></span>

                    <span id="previewLocation"></span>

                </div>


                <!-- Resume Body -->
                <div class="resume-body">

                    <aside>

                        <!-- Profile -->
                        <section class="resume-section">

                            <h2>Profile</h2>

                            <p id="previewSummary"></p>

                        </section>


                        <!-- Skills -->
                        <section class="resume-section">

                            <h2>Skills</h2>

                            <ul id="previewSkills"></ul>

                        </section>


                        <!-- Languages -->
                        <section class="resume-section">

                            <h2>Languages</h2>

                            <ul id="previewLanguages"></ul>

                        </section>

                    </aside>


                    <!-- Main Column -->
                    <div class="main-column">

                        <!-- Experience -->
                        <section class="resume-section">

                            <h2>Experience</h2>

                            <div id="previewExperience"></div>

                        </section>


                        <!-- Education -->
                        <section class="resume-section">

                            <h2>Education</h2>

                            <div id="previewEducation"></div>

                        </section>

                    </div>

                </div>

            </div>

        </article>

    </section>

</main>

    <script src="app.js"></script>
  </body>
</html>
